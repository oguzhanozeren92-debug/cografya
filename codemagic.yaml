# Globriva — iOS release pipeline (Capacitor + Vite).
# Add this private repository to Codemagic and select the workflow to run.
# Production publishing is NEVER automatically triggered by a Git push.
workflows:
  atlas-ios-smoke:
    name: Globriva — iOS simulator smoke test
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install locked JS dependencies
        script: npm ci --no-audit --no-fund
      - name: Verify translations, TypeScript, web build and Street game
        script: |
          node scripts/check-i18n.mjs
          node --test tests/street/country-mode.test.mjs
          node --experimental-strip-types --test tests/drone/hints.test.mjs
          npm run typecheck
          npm run build
          node scripts/panoramas/export-appstore-review.mjs
          node scripts/panoramas/verify-commons-licenses.mjs
          # Device/TestFlight QA can proceed while the photo review is unfinished.
          # Strict final App Store gate runs only in atlas-ios-store-readiness.
          npm run gallery:audit
      - name: Check Apple SDK and required review assets
        script: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode /{print $2}' | cut -d. -f1)"
          test -n "$XCODE_MAJOR" && test "$XCODE_MAJOR" -ge 26 || {
            echo "App Store Connect requires Xcode 26+ and the iOS 26 SDK."
            exit 1
          }
          node scripts/app-store-preflight.mjs
      - name: Generate native iOS project and bundle icon
        script: |
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          mkdir -p assets
          cp resources/icon.png assets/icon-only.png
          npx --yes @capacitor/assets generate --ios
          node scripts/configure-admob-native.mjs
          node scripts/configure-push-ios.mjs
      - name: Build unsigned iOS simulator app
        script: |
          # Capacitor 8 uses Swift Package Manager by default.
          # Its project is an .xcodeproj, not an .xcworkspace.
          test -d ios/App/App.xcodeproj || {
            echo "Missing ios/App/App.xcodeproj after cap add ios"
            find ios/App -maxdepth 2 -name '*.xcodeproj' -o -name '*.xcworkspace'
            exit 1
          }
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/ios-simulator-build" \
            CODE_SIGNING_ALLOWED=NO build > /tmp/atlas-ios-smoke.log 2>&1 || {
              tail -n 130 /tmp/atlas-ios-smoke.log
              exit 1
            }
    artifacts:
      - ios-simulator-build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/atlas-ios-smoke.log
      - appstore-review/photo-audit.csv
      - appstore-review/release-report.json
      - appstore-review/commons-source-audit.json

  # Internal TestFlight builds are for finding mobile issues; they do NOT
  # certify editorial asset review or grant permission to submit to App Review.
  atlas-ios-testflight:
    name: Globriva — internal QA IPA to TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      # Create this integration in Codemagic's Developer Portal integrations.
      app_store_connect: TarlaPusula CI 2
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        # Confirm this identifier exists in YOUR Apple Developer account.
        bundle_identifier: com.oguzhanozeren.cografya
      # Create the group in Codemagic. Add Atlas-only Supabase credentials
      # when its separate project is ready; never put secrets in Git.
      groups:
        - atlas_arena_release
      vars:
        VITE_ATLAS_API_ORIGIN: "https://atlas-arena-tau.vercel.app"
    scripts:
      - name: Verify multiplayer credentials are present for TestFlight
        script: |
          # Vercel variables are NOT inherited by Codemagic's native Vite build.
          # Supply these two public client settings in the atlas_arena_release group.
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY in the Codemagic atlas_arena_release environment group."
            echo "The 1v1 VS mode cannot work in an IPA without both variables."
            exit 1
          fi
          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co|https://*.supabase.in) ;;
            *) echo "VITE_SUPABASE_URL must be a valid HTTPS Supabase API origin."; exit 1 ;;
          esac
      - name: Install and verify game
        script: |
          npm ci --no-audit --no-fund
          node scripts/check-i18n.mjs
          node --test tests/street/country-mode.test.mjs
          node --experimental-strip-types --test tests/drone/hints.test.mjs
          npm run typecheck
          npm run build
          node scripts/panoramas/export-appstore-review.mjs
          node scripts/panoramas/verify-commons-licenses.mjs
          # Device/TestFlight QA can proceed while the photo review is unfinished.
          # Strict final App Store gate runs only in atlas-ios-store-readiness.
          npm run gallery:audit
      - name: Check Apple SDK and required review assets
        script: |
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode /{print $2}' | cut -d. -f1)"
          test -n "$XCODE_MAJOR" && test "$XCODE_MAJOR" -ge 26 || {
            echo "App Store Connect requires Xcode 26+ and the iOS 26 SDK."
            exit 1
          }
          node scripts/app-store-preflight.mjs
      - name: Generate Capacitor iOS project and approved application icon
        script: |
          npx cap add ios --packagemanager SPM
          npx cap sync ios
          mkdir -p assets
          cp resources/icon.png assets/icon-only.png
          npx --yes @capacitor/assets generate --ios
          node scripts/configure-admob-native.mjs
          node scripts/configure-push-ios.mjs
          CAPACITOR_PLATFORM=ios npm run native:release:check
      - name: Apply distribution signing and unique build number
        script: |
          test -d ios/App/App.xcodeproj || {
            echo "Missing native iOS Xcode project"
            exit 1
          }
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"
          cd ios/App
          xcrun agvtool new-version -all "$BUILD_NUMBER"
      - name: Create signed TestFlight IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - appstore-review/photo-audit.csv
      - appstore-review/release-report.json
      - appstore-review/commons-source-audit.json
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload the IPA to App Store Connect. The existing internal TestFlight
        # group should use Automatic Distribution in App Store Connect.
        # Do not explicitly add an Automatic internal group via beta_groups:
        # Apple rejects that API operation, even after processing succeeds.
        # submit_to_testflight is for external beta review; internal tests
        # do not require it, and App Store review is initiated manually.
        submit_to_testflight: false
        submit_to_app_store: false

  # Deliberately separate the strict App Store media gate from installation,
  # simulator smoke tests and INTERNAL TestFlight test builds.
  # It is expected to FAIL until all approved media are independently reviewed.
  atlas-ios-store-readiness:
    name: Globriva — App Store media release gate (strict)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
    scripts:
      - name: Generate complete photo and licensing evidence
        script: |
          npm ci --no-audit --no-fund
          npm run gallery:photo-review
          npm run gallery:commons-audit
      - name: Enforce independently verified gallery before App Review
        script: |
          npm run gallery:release-check
          node scripts/app-store-preflight.mjs
          echo "Static editorial and app preflight passed; device and App Store metadata checks are still required."
    artifacts:
      - appstore-review/photo-audit.csv
      - appstore-review/release-report.json
      - appstore-review/commons-source-audit.json
    # No publishing: green here is still NOT Apple review approval.
