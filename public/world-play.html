<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1721">
<meta property="og:title" content="Globriva · Dünya Keşfi"><meta property="og:description" content="20 şehir, 60 gerçek fotoğraf. Dünyanın neresindesin?">
<title>Globriva · Dünya Keşfi</title>
<style>
:root{color-scheme:dark;--bg:#0b1a24;--panel:#142d3a;--border:#54717f;--gold:#f2c777;--text:#f8efe0;--sub:#b9c9ce;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#2d4552,#08131c 65%);color:var(--text)}
main{max-width:650px;padding:14px 16px 30px;margin:0 auto;min-height:100dvh}
a{color:#f3d6a0}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.6}
nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 19px}nav a{border:1px solid #8e825f;border-radius:11px;text-decoration:none;padding:10px;color:var(--gold);font-size:12px;font-weight:800}.brand{font:700 25px Georgia,serif}.brand small{display:block;font:10px system-ui;letter-spacing:1px;color:#c3ced3;margin-top:3px}
.badge{color:var(--gold);letter-spacing:1.25px;font-size:11px;font-weight:850}.hero{margin:22px 0 10px}h1{font:700 clamp(30px,7vw,43px)/1.1 Georgia,serif;margin:10px 0}h2{font:700 22px Georgia,serif;margin:9px 0}.muted{color:var(--sub);line-height:1.5;font-size:14px}.panel{border:1px solid #5d7280;background:#162c37;border-radius:17px;padding:17px;margin:15px 0}
.big{display:block;font:bold 34px Georgia,serif;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border-radius:11px;border:1px solid #506674;padding:12px;text-align:center;background:#0c202d}.stat span{font-size:11px;color:var(--sub)}
label{display:block;font-size:12px;color:#e9c88c;font-weight:800;margin:12px 0 6px}
select{background:#0c2230;color:var(--text);border:1px solid #7691a0;border-radius:11px;padding:13px;width:100%;font-size:16px}
.action{min-height:49px;width:100%;padding:13px 16px;background:linear-gradient(140deg,#fce5b3,#d49e51);border:none;border-radius:12px;font-weight:900;color:#261900;margin-top:11px}
.secondary{background:#1d3947;border:1px solid #7c8e92;color:#ffe7af}
.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.roundInfo{font-weight:800;font-size:13px;color:#f3c987}
.progress{height:5px;border-radius:7px;background:#334c59;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#dfb46d;transition:width .15s}
.displayPhoto{height:min(40dvh,340px);min-height:160px;border:1px solid #5d7480;border-radius:15px;overflow:hidden;background:#081720;display:flex;align-items:center;justify-content:center}
.displayPhoto img{width:100%;height:100%;object-fit:contain}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.thumbs button{padding:0;position:relative;background:#122a35;border:1px solid #647b86;border-radius:10px;overflow:hidden;height:62px}
.thumbs button.active{outline:2px solid #ffce7d;outline-offset:1px}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs b{position:absolute;right:5px;top:5px;background:#071923cf;color:#ffdf9e;font-size:10px;border-radius:5px;padding:2px 5px}
.question{font:700 clamp(19px,3.3dvh,25px)/1.24 Georgia,serif;text-align:center;margin:14px 0}
.answers{display:grid;gap:8px}.option{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:#1a3542;color:#fff4e0;border:1px solid #587281;border-radius:11px;min-height:50px;font-size:15px}
.option b{flex:none;width:29px;height:29px;border-radius:7px;background:#2e4e5c;color:#eec781;display:grid;place-items:center}
.option.correct{border-color:#68bf8b;background:#1b513d}.option.wrong{border-color:#db8888;background:#582f37}
.feedback{padding:10px;border-radius:10px;background:#263a45;margin-top:11px;font-size:13px}.feedback strong{color:#ffdf9e}
details{margin-top:10px;color:#b6c5c9;font-size:12px}details a{overflow-wrap:anywhere}
.results{text-align:center}.trophy{font-size:65px;margin-top:20px}.note{color:#9fb0b9;font-size:11px;line-height:1.5}
.error{border:1px solid #c68479;background:#4a3030;color:#ffe3d6;padding:12px;border-radius:11px}
@media(max-height:680px){nav{margin-bottom:8px}.displayPhoto{height:32dvh;min-height:100px}.thumbs button{height:42px}.option{min-height:43px;padding:6px 8px}.answers{gap:5px}.question{margin:7px 0}}
</style></head>
<body><main id="app"><nav><div class="brand">Globriva<small>DÜNYA KEŞFİ</small></div><a href="https://atlas-arena-tau.vercel.app/">Ana sayfa</a></nav><p class="muted">Dünya turu yükleniyor…</p></main>
<script>
(function(){
'use strict';
var all=[],region='all',rounds=[],round=0,score=0,answered=false,choice=-1,photo=0,ready=false;
var app=document.getElementById('app');
var regionNames={Africa:'Afrika','South America':'Güney Amerika','East Asia':'Doğu Asya','Southeast Asia':'Güneydoğu Asya','South Asia':'Güney Asya','West Asia':'Orta Doğu',Oceania:'Okyanusya'};
var esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','&#39;':"&#39;"}[c]||('&#'+c.charCodeAt(0)+';')})};
function shuffle(v){var a=v.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function header(){return '<nav><div class="brand">Globriva<small>DÜNYA KEŞFİ</small></div><a href="https://atlas-arena-tau.vercel.app/">Ana sayfa</a></nav>'}
function showHome(){
 var select='<option value="all">Tüm dünya · 20 şehir</option>'+Object.keys(regionNames).map(function(k){var n=all.filter(function(q){return q.region===k}).length;return '<option value="'+esc(k)+'">'+esc(regionNames[k])+' · '+n+' şehir</option>'}).join('');
 app.innerHTML=header()+'<div class="hero"><div class="badge">AFRİKA · AMERİKA · ASYA · OKYANUSYA</div><h1>Dünyanın Neresindesin?</h1><p class="muted">Gerçek fotoğrafları incele, 3 farklı açıya bak, doğru ülkeyi seç. Globriva’nın dünya keşif turu.</p></div>'+
 '<div class="stats"><div class="stat"><span class="big">'+all.length+'</span><span>Şehir</span></div><div class="stat"><span class="big">'+all.reduce(function(n,x){return n+x.photos.length},0)+'</span><span>Gerçek fotoğraf</span></div><div class="stat"><span class="big">7</span><span>Dünya bölgesi</span></div></div>'+
 '<div class="panel"><label for="reg">Keşif bölgesi</label><select id="reg">'+select+'</select><button class="action" id="play">🌍 Keşfe Başla</button></div>'+
 '<p class="note">Fotoğraflar Wikimedia Commons kaynaklarından gelir. Her fotoğrafın atıf ve kullanım lisansı soru içinde görülebilir. Yeni dünya turu Globriva’nın mevcut web sürümünden bağımsız bir önizlemedir.</p>';
 app.querySelector('#reg').value=region;app.querySelector('#reg').onchange=function(){region=this.value};
 app.querySelector('#play').onclick=start;
}
function start(){
 var pool=shuffle(all.filter(function(x){return region==='all'||x.region===region}));
 if(!pool.length)return;
 // If the user chooses all regions, sample one from each first.
 if(region==='all'){
 var groups={};pool.forEach(function(x){(groups[x.region]||(groups[x.region]=[])).push(x)});
 var order=shuffle(Object.keys(groups)),pick=[];
 order.forEach(function(k){pick.push(groups[k].shift())});
 pool=pick.concat(shuffle(Object.values(groups).flat()));
 }
 rounds=pool.slice(0,10);round=0;score=0;answered=false;choice=-1;photo=0;showQuestion();
}
function showQuestion(){
 if(round>=rounds.length){showResult();return}
 var q=rounds[round];if(!q||q.photos.length!==3){showResult();return}
 var reveal=answered;
 var photoData=q.photos[photo];
 var n=round+1,total=rounds.length;
 app.innerHTML=header()+'<div class="row roundInfo"><span>'+esc(regionNames[q.region])+' · '+n+'/'+total+'</span><span>✓ '+score+' puan</span></div>'+
 '<div class="progress"><span style="width:'+Math.round(100*n/total)+'%"></span></div>'+
 '<div class="displayPhoto"><img id="mainpic" alt="Dünya keşfi fotoğrafı, açı '+(photo+1)+'" src="'+esc(photoData.thumb_url)+'"></div>'+
 '<div class="thumbs">'+q.photos.map(function(p,i){return '<button data-photo="'+i+'" class="'+(i===photo?'active':'')+'" aria-label="'+(i+1)+'. fotoğrafı gör"><img src="'+esc(p.thumb_url)+'" alt="Fotoğraf açısı"><b>'+(i+1)+'/3</b></button>'}).join('')+'</div>'+
 '<h2 class="question">'+esc(q.question)+'</h2><div class="answers">'+q.choices.map(function(t,i){var state=reveal?(i===q.correct_index?' correct':i===choice?' wrong':''):'';return '<button data-answer="'+i+'" class="option'+state+'" '+(reveal?'disabled':'')+'><b>'+('ABCD'[i])+'</b><span>'+esc(t)+'</span></button>'}).join('')+'</div>'+
 (reveal?'<div class="feedback"><strong>'+(choice===q.correct_index?'✓ Doğru! +100':'✕ Yanlış')+'</strong> · Doğru cevap: '+esc(q.choices[q.correct_index])+'</div><button class="action" id="next">'+(n===total?'Sonuçları Gör':'Sonraki Şehir ❯')+'</button>':'')+
 '<details><summary>Fotoğrafçı, kaynak ve lisans</summary><p>'+esc(photoData.artist)+' · '+esc(photoData.licence)+'</p><a target="_blank" rel="noopener noreferrer" href="'+esc(photoData.source_url)+'">Wikimedia Commons fotoğraf sayfası</a> · '+(photoData.licence_url?'<a target="_blank" rel="noopener noreferrer" href="'+esc(photoData.licence_url)+'">Lisans</a>':'')+'</details>';
 app.querySelectorAll('[data-photo]').forEach(function(b){b.onclick=function(){photo=Number(b.dataset.photo);showQuestion()}});
 if(!reveal){app.querySelectorAll('[data-answer]').forEach(function(b){b.onclick=function(){answered=true;choice=Number(b.dataset.answer);if(choice===q.correct_index)score+=100;showQuestion()}})}
 else app.querySelector('#next').onclick=function(){round++;answered=false;choice=-1;photo=0;showQuestion()};
}
function showResult(){
 var max=rounds.length*100,percent=max?Math.round(score/max*100):0;
 app.innerHTML=header()+'<section class="panel results"><div class="trophy">'+(percent>=80?'🏆':percent>=50?'🌟':'🧭')+'</div><div class="badge">DÜNYA KEŞFİ TAMAMLANDI</div><h1>'+score+' / '+max+'</h1><p class="muted">'+rounds.length+' şehir gezdin. Başarı: %'+percent+'. Yeniden oynayarak farklı ülkeler ve açılar keşfet.</p><button class="action" id="again">Yeni Dünya Turu</button><button class="action secondary" id="whatsapp">WhatsApp’ta Paylaş</button></section>';
 app.querySelector('#again').onclick=showHome;
 app.querySelector('#whatsapp').onclick=function(){var msg='🌍 Globriva Dünya Keşfi’nde '+score+'/'+max+' puan yaptım! Sen kaç yaparsın? '+location.href.split('?')[0];window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')};
}
fetch('https://edofvhmcafduobzyygnm.supabase.co/functions/v1/globriva-world-play?data=1',{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(o){
 if(!Array.isArray(o.cities)||!o.cities.length)throw Error('Henüz oynanabilir şehir yok');
 all=o.cities;ready=true;showHome();
}).catch(function(e){app.innerHTML=header()+'<h1>Veri yüklenemedi</h1><div class="error">'+esc(e.message||e)+'</div><button class="action" id="retry">Yeniden Dene</button>';app.querySelector('#retry').onclick=function(){location.reload()}});
})();
</script>
</body></html>
