name: Atlas Arena — sync street JPGs to own domain
on:
  push:
    branches: [main]
    paths:
      - 'scripts/panoramas/sync_street_photos.py'
      - '.github/workflows/street-static-photos.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: atlas-street-static-gallery
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-arena
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
      - name: Prepare JPEG verifier
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<12' boto3
      - name: Verify and export four-angle photos from R2
        run: python3 -u scripts/panoramas/sync_street_photos.py
      - name: Commit usable gallery and server whitelist
        run: |
          git config user.name "atlas-panorama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/street-photos server/street/photo-ready.mjs
          if ! git diff --staged --quiet; then
            git commit -m "assets(street): publish verified JPEG photos on Atlas domain"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
