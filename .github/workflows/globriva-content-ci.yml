name: Globriva Content and Media QA
# Hosted Actions jobs are not being assigned runners on this account.
# Keep the QA job available for manual runs until Actions capacity is restored.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check gameplay, hint safety and existing location tests
        run: node --test tests/geo-content.test.mjs tests/drone-live.test.mjs tests/drone/hints.test.mjs tests/street/country-mode.test.mjs
      - name: Report loader-linked playable inventory
        run: node scripts/audit-playable-content.mjs --strict
      - name: Verify live URLs and Commons metadata (external service may be unavailable)
        continue-on-error: true
        run: node scripts/panoramas/audit-archive.mjs --live --strict
      - name: Type check
        run: npm run typecheck
      - name: Build release bundle
        run: npx vite build
