name: Atlas Arena — sync drone JPGs to own domain
on:
  push:
    branches: [main]
    paths:
      - 'scripts/panoramas/sync_drone_photos.py'
      - '.github/workflows/drone-static-photos.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atlas-drone-static-gallery
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-arena
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check R2 credentials exist
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
      - name: Install preview image utilities
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<12' boto3
      - name: Copy five real drone galleries from R2
        run: python3 -u scripts/panoramas/sync_drone_photos.py
      - name: Commit verified drone previews
        run: |
          git config user.name "atlas-panorama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/drone-photos server/drone/photo-ready.mjs
          if ! git diff --staged --quiet; then
            git commit -m "assets(drone): publish five licensed photo galleries on Atlas domain"
            # Rebase onto current main before pushing; the verified ready list exists there.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
