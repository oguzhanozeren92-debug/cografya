name: Atlas Arena 360 Panorama Library

on:
  push:
    branches: [main]
    paths:
      - 'scripts/panoramas/discover_commons.py'
      - '.github/workflows/street-panoramas.yml'
  workflow_dispatch:
    inputs:
      task:
        description: Candidate discovery or publish manually approved panoramas
        required: true
        type: choice
        options:
          - discover
          - publish
      ids:
        description: For publish only, comma-separated reviewed IDs (up to 10)
        required: false
        type: string

permissions:
  contents: write

jobs:
  discover:
    if: github.event_name == 'push' || inputs.task == 'discover'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find 360 panorama candidates (no downloads; no publishing)
        run: python3 scripts/panoramas/discover_commons.py --limit 300 --output panoramas/candidates.json
      - name: Download candidates for human inspection
        uses: actions/upload-artifact@v4
        with:
          name: panorama-candidates-needing-review
          path: panoramas/candidates.json
          retention-days: 30

  publish:
    if: inputs.task == 'publish'
    runs-on: ubuntu-24.04
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-arena
      IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify credentials & requested IDs
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$IDS"
      - name: Tools for 360-degree multiresolution tiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y hugin-tools
          python3 -m pip install --break-system-packages Pillow numpy boto3
          git clone --depth 1 https://github.com/mpetroff/pannellum.git /tmp/pannellum
      - name: Download reviewed originals, create tiles, publish to R2
        run: |
          python3 scripts/panoramas/publish.py --ids "$IDS"
      - name: Publish private coordinate catalog after successful batch
        run: |
          git config user.name "atlas-panorama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/street/approved.mjs
          if ! git diff --staged --quiet; then
            git commit -m "assets: publish verified 360 panorama batch to R2"
            git push origin HEAD:main
          fi
