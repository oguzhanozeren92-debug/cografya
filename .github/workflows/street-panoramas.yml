name: Atlas Arena — 360° fotoğraf adaylarını tara

on:
  push:
    branches: [main]
    paths:
      - 'scripts/panoramas/discover_commons.py'
      - '.github/workflows/street-panoramas.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Find licensed panorama candidates (no publishing)
        run: python3 scripts/panoramas/discover_commons.py --limit 300 --output panoramas/candidates.json
      - name: Upload candidate list for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: panorama-candidates-needing-review
          path: panoramas/candidates.json
          retention-days: 30
