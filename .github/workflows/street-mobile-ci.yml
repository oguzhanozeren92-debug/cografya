name: Atlas Arena — Mobile Panorama Quality Check

on:
  push:
    branches: [main]
    paths:
      - 'src/components/StreetPanorama.tsx'
      - 'src/components/StreetDetectiveScreen.tsx'
      - '.github/workflows/street-mobile-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify integrated 360-degree location questions and licenses
        run: node --test tests/heritage360-integration.test.mjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build web app
        run: npm run build
