name: Atlas Arena Admin Panel CI
on:
  push:
    branches: [main]
    paths:
      - 'src/components/AdminDashboard.tsx'
      - 'src/lib/atlasTelemetry.ts'
      - 'src/hooks/useGame.ts'
      - 'src/components/DailyChallengeScreen.tsx'
      - 'src/components/StreetDetectiveScreen.tsx'
      - 'src/lib/streetHintLocale.ts'
      - 'server/street/country-mode.mjs'
      - 'server/street/core.mjs'
      - 'api/street/guess.js'
      - 'tests/street/country-mode.test.mjs'
      - 'src/components/DroneDetectiveScreen.tsx'
      - 'src/components/LocationLeaguePanel.tsx'
      - 'src/lib/streetLeaderboard.ts'
      - 'src/lib/droneLeaderboard.ts'
      - 'src/App.tsx'
      - 'src/lib/capitalLanguage.ts'
      - 'src/lib/clueLanguage.ts'
      - 'src/lib/clueLandmarks.ts'
      - 'src/components/StreetPhoto.tsx'
      - 'src/components/StreetWorldMap.tsx'
      - 'src/components/HUD.tsx'
      - 'src/components/ReviveScreen.tsx'
      - 'src/components/NotificationSettings.tsx'
      - 'scripts/check-i18n.mjs'
      - 'src/lib/i18n.tsx'
      - 'src/lib/i18nStrings.ts'
      - 'src/lib/countryLanguage.ts'
      - 'src/components/QuestionPanel.tsx'
      - 'src/components/StartScreen.tsx'
      - 'src/components/GameOverScreen.tsx'
      - 'src/components/WeeklyLeaderboardScreen.tsx'
      - 'src/components/DailyChallengeScreen.tsx'
      - 'src/components/ExploreMapScreen.tsx'
      - 'src/main.tsx'
      - '.github/workflows/geo-admin-ci.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check localization coverage
        run: node scripts/check-i18n.mjs
      - name: Street Detective country-mode checks
        run: node --test tests/street/country-mode.test.mjs
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
