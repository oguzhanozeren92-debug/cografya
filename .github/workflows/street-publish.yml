name: Atlas Arena — onaylı panoramaları R2'ye yükle

on:
  workflow_dispatch:
    inputs:
      ids:
        description: Manually reviewed panorama IDs, comma-separated (max 10)
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-arena
      IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify credentials & requested IDs
        run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$IDS"
      - name: Tools for 360-degree multiresolution tiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y hugin-tools
          python3 -m pip install --break-system-packages Pillow numpy boto3
          git clone --depth 1 https://github.com/mpetroff/pannellum.git /tmp/pannellum
      - name: Download reviewed originals, create tiles, publish to R2
        run: |
          python3 scripts/panoramas/publish.py --ids "$IDS"
      - name: Publish private coordinate catalog after successful batch
        run: |
          git config user.name "atlas-panorama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/street/approved.mjs
          if ! git diff --staged --quiet; then
            git commit -m "assets: publish verified 360 panorama batch to R2"
            git push origin HEAD:main
          fi
