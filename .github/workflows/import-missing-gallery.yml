name: Globriva - complete 4 missing Commons city albums

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-missing-gallery.yml'
      - 'scripts/panoramas/import-missing-commons-gallery.py'

permissions:
  contents: write

concurrency:
  group: globriva-missing-city-albums
  cancel-in-progress: false

jobs:
  import-photos:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install 'Pillow>=10,<12'
      - name: Validate Commons source, license, author and convert images
        id: import
        shell: bash
        run: |
          set +e
          python -u scripts/panoramas/import-missing-commons-gallery.py
          echo "result=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify approved photos have correct bytes and catalog
        run: node scripts/panoramas/check-local-gallery.mjs --strict > /tmp/globriva-gallery-qa.json
      - name: Commit only audited media and results
        shell: bash
        run: |
          git config user.name 'globriva-archive-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/drone-gallery/catalog-v2.json reports/globriva-gallery-import.json
          git add public/drone-gallery/photos/album-017 public/drone-gallery/photos/album-018 public/drone-gallery/photos/album-019 public/drone-gallery/photos/album-020
          if ! git diff --staged --quiet; then
            git commit -m 'media(drone): import validated Prague Venice Vienna Lisbon images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Summarize actual photo imports and blockers
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('reports/globriva-gallery-import.json')
          r=json.loads(p.read_text()) if p.exists() else {'ready':[],'failed':[{'error':'No import report generated'}]}
          lines=['# Globriva city gallery import',
             f'- Imported complete albums: {len(r["ready"])}',
             f'- New photo files: {sum(len(x["photos"]) for x in r["ready"])}',
             f'- Blocked albums: {len(r["failed"])}']
          lines.extend(f'- BLOCKED {x["album"]}: {x["error"]}' for x in r['failed'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globriva-city-import-report
          path: |
            reports/globriva-gallery-import.json
            /tmp/globriva-gallery-qa.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on upstream Wikimedia failure after preserving diagnostics
        if: steps.import.outputs.result != '0'
        run: |
          echo 'One or more albums blocked. See committed diagnostics and Action summary.'
          exit 1
