name: Atlas Arena — publish 5 R2 drone panoramas
on:
  push:
    branches: [main]
    paths:
      - 'panoramas/drone-approved.json'
      - 'scripts/panoramas/publish_drone.py'
      - '.github/workflows/drone-r2-publish.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atlas-drone-5-publish
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-arena
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: |
          test -n "$R2_ACCOUNT_ID" && test -n "$R2_ACCESS_KEY_ID" && test -n "$R2_SECRET_ACCESS_KEY"
      - name: Install Pannellum conversion tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y hugin-tools
          python3 -m pip install --break-system-packages Pillow numpy boto3
          git clone --depth 1 https://github.com/mpetroff/pannellum.git /tmp/pannellum
      - name: Validate licenses and publish only complete R2 media
        run: python3 -u scripts/panoramas/publish_drone.py
      - name: Commit catalog only after 5/5 verified
        run: |
          git config user.name "atlas-panorama-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/drone/approved.mjs
          if ! git diff --staged --quiet; then
            git commit -m "assets(drone): register five verified R2 360 panoramas"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
