name: Globriva — publish 3-4 photo location albums to R2

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated approved album IDs in drone-gallery-candidates.json (max 10)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: globriva-gallery-v2-r2
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: atlas-arena
      REQUESTED_IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm configured R2 secrets exist
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
      - name: Install image verification dependencies
        run: python3 -m pip install --break-system-packages 'Pillow>=10,<12' boto3
      - name: Verify each source, convert, upload and independently HEAD-check all JPGs
        run: python3 -u scripts/panoramas/publish_drone_gallery.py --ids "$REQUESTED_IDS"
      - name: Confirm content-only update
        run: echo "No App Store, TestFlight, Codemagic or Vercel build was invoked."
