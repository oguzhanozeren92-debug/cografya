name: Refresh Capacitor dependency lock

on:
  push:
    paths:
      - package.json
      - .env.production
      - capacitor.config.ts
      - scripts/configure-admob-native.mjs
      - scripts/validate-admob-release.mjs
      - src/lib/rewardedAds.ts
      - src/components/StartScreen.tsx
      - src/components/HomePlanet.tsx
      - src/components/HomePlanet3D.tsx
      - src/components/ArenaParticles.tsx
      - src/components/VictoryBadge.tsx
      - src/components/GameOverScreen.tsx
      - src/components/DailyChallengeScreen.tsx
      - src/lib/gameFx.ts
      - src/App.tsx
      - src/index.css
      - .github/workflows/sync-native-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and lock native dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean dependency install and build
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Commit regenerated lockfile
        if: success()
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Capacitor and AdMob dependencies"
            git push
          fi